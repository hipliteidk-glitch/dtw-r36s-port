name: Build Dude Theft Wars R36S Port

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apk_asset:
        description: 'APK release asset name'
        required: false
        default: 'com.PoxelStudios.DudeTheftAuto_0.87SC-300011_minAPI21.arm64-v8a.armeabi-v7a.nodpi._apkmirror.com.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc g++ python3 unzip git wget curl

      - name: Clone NextOS Framework
        run: |
          git clone --recurse-submodules https://github.com/OlhaGatito/AI-Port-Arm.git nextos-framework

      - name: Download APK from release asset
        id: download_apk
        run: |
          ASSET="${{ github.event.inputs.apk_asset || github.event.release.assets[0].name || 'com.PoxelStudios.DudeTheftAuto_0.87SC-300011_minAPI21.arm64-v8a.armeabi-v7a.nodpi._apkmirror.com.apk' }}"
          TAG="${{ github.event.release.tag_name || 'latest' }}"
          echo "Looking for asset: $ASSET in release: $TAG"
          mkdir -p /tmp/apk
          gh release download "$TAG" \
            --repo ${{ github.repository }} \
            --pattern "$ASSET" \
            --dir /tmp/apk
          if [ -f "/tmp/apk/$ASSET" ]; then
            echo "apk_path=/tmp/apk/$ASSET" >> $GITHUB_OUTPUT
            echo "APK downloaded successfully"
          else
            echo "APK download failed"
            exit 1
          fi

      - name: List downloaded files
        run: ls -laR /tmp/apk/ 2>&1

      - name: Generate port from APK
        run: |
          cd nextos-framework/nextos_ports_android-master
          bash tools/new-port.sh "${{ steps.download_apk.outputs.apk_path }}" dude-theft-wars 2>&1
          ls -la ports/ 2>&1

      - name: Build port
        run: |
          cd nextos-framework/nextos_ports_android-master
          bash tools/build-port.sh ports/dude-theft-wars gles2 2>&1
          ls -la ports/dude-theft-wars/build/ 2>&1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dude-theft-wars-r36s-port
          path: nextos-framework/nextos_ports_android-master/ports/dude-theft-wars/build/
          retention-days: 7
